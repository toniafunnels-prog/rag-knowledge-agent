<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Knowledge Base Q&A Agent</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; background: #0f1115; color: #e8e8e8; }
  h1 { font-size: 20px; }
  #chat { border: 1px solid #2a2d34; border-radius: 8px; padding: 16px; min-height: 300px; margin-bottom: 12px; }
  .msg { margin-bottom: 14px; }
  .q { color: #7dd3fc; font-weight: 600; }
  .a { color: #e8e8e8; white-space: pre-wrap; }
  .src { color: #888; font-size: 12px; margin-top: 4px; }
  input { width: 78%; padding: 10px; border-radius: 6px; border: 1px solid #2a2d34; background: #1a1c22; color: white; }
  button { padding: 10px 16px; border-radius: 6px; border: none; background: #2563eb; color: white; cursor: pointer; }
</style>
</head>
<body>
  <h1>📚 Knowledge Base Q&A Agent</h1>
  <p style="color:#999; font-size:14px;">Ask a question about the ingested documents. Answers are grounded and cite sources.</p>
  <div id="chat"></div>
  <input id="question" placeholder="Ask a question..." onkeydown="if(event.key==='Enter') ask()" />
  <button onclick="ask()">Ask</button>

  <script>
    async function ask() {
      const input = document.getElementById('question');
      const q = input.value.trim();
      if (!q) return;
      const chat = document.getElementById('chat');
      chat.innerHTML += `<div class="msg"><div class="q">You: ${q}</div></div>`;
      input.value = '';
      const res = await fetch('/ask', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({question: q})
      });
      const data = await res.json();
      chat.innerHTML += `<div class="msg"><div class="a">${data.answer}</div><div class="src">Sources: ${data.sources.join(', ')}</div></div>`;
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
